  <!-- No browser zoom on a phone (it crops the page): Safari and Chrome on an iPhone ignore user-scalable=no, so a
       pinch is cancelled here, and touch-action on html and body stops pinch and double-tap zoom too. The page's own
       touch and pointer handlers still get every event; a Mac's trackpad pinch is left alone. -->
  <script>
    if (navigator.maxTouchPoints > 0) {
      const no = (e) => { if (e.cancelable) e.preventDefault(); }, held = { passive: false };
      for (const g of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(g, no, held);
      document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) no(e); }, held);
    }
  </script>
