<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- A project's footage page: copy this to <the site>/footage/index.html, set the name, the words and the colours. The
     films come from footage.json beside it (~/codeprojects/footage/publish.mjs adds to it); everything else about them
     (playing, Save to Photos, downloads, links) from footage.js, the same on every project's page. -->
<title>Codevember 2026 · Footage</title>
<meta name="description" content="The films of Codevember 2026: a WebGPU sketch a day, each a seamless loop.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* the project's colours and type (footage.js lays the films out with them) */
  :root {
    --bg: #ece7df; --fg: #2b2520; --muted: #7d746a; --line: #d6cfc4; --accent: #b4441f;
    --font-title: "IBM Plex Mono", ui-monospace, monospace; --radius: 4px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  header, main, footer { max-width: 1100px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)); }
  header { padding-top: clamp(32px, 7vw, 56px); padding-bottom: 20px; }
  h1 { font: 500 clamp(22px, 4vw, 32px)/1.2 var(--font-title); letter-spacing: 0.04em; margin: 0; }
  header p { color: var(--muted); margin: 10px 0 0; max-width: 64ch; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* the way back, over the title: ericlevin.dev (its mark, a gold world in two rings, as on every project there) › the project */
  .trail { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 9px; margin: 0 0 18px; font-size: 13px; color: var(--muted); }
  .trail a { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
  .trail a:hover { color: var(--fg); text-decoration: none; }
  .trail svg { flex: none; width: 18px; height: 18px; }
  footer { color: var(--muted); font-size: 13px; padding-top: 12px; padding-bottom: max(40px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <nav class="trail" aria-label="Where this is">
    <a href="https://www.ericlevin.dev/" title="ericlevin.dev: all the worlds"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="#B98CFF" stroke-width="1.6" opacity=".6"/><circle cx="16" cy="16" r="11" fill="none" stroke="#6FE3F0" stroke-width="1.8" opacity=".8"/><circle cx="16" cy="16" r="7" fill="#E8C15A"/></svg>ericlevin.dev</a>
    <span aria-hidden="true">›</span><a href="../">Codevember 2026</a>
  </nav>
  <h1>Codevember 2026 · Films</h1>
  <p>Every day of <a href="../">Codevember</a>, filmed: one seamless loop each, rendered frame by frame from the live WebGPU sketch.</p>
</header>
<main id="films"><p class="empty">Loading…</p></main>
<footer><a href="../">All the sketches, live</a></footer>
<script src="https://footage.ericrius1.workers.dev/footage.js" onerror="document.getElementById('films').innerHTML = '<p>The films didn’t load. Try again in a moment.</p>'"></script>
</body>
</html>
